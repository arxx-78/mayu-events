<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --gold: #d4af37;
  --gold-light: #ffd700;
  --dark: #0a0a0a;
  --text: #ffffff;
  --text-muted: #a0a0a0;
  --gradient-gold: linear-gradient(135deg, #ffd700 0%, #d4af37 50%, #b8860b 100%);
}
body { font-family: 'Poppins', sans-serif; background: var(--dark); color: var(--text); overflow-x: hidden; }
h1, h2, h3 { font-family: 'Cinzel', serif; }

.navbar { position: fixed; top: 0; left: 0; right: 0; background: rgba(10, 10, 10, 0.95); backdrop-filter: blur(10px); padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; border-bottom: 2px solid rgba(212, 175, 55, 0.3); }
.nav-logo { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 800; background: var(--gradient-gold); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-family: 'Cinzel', serif; letter-spacing: 1px; text-decoration: none; }
.nav-logo i { color: var(--gold); -webkit-text-fill-color: var(--gold); }
.nav-links { display: flex; gap: 30px; align-items: center; }
.nav-links a { color: var(--text); text-decoration: none; font-size: 14px; font-weight: 500; transition: all 0.3s; letter-spacing: 1px; text-transform: uppercase; }
.nav-links a:hover { color: var(--gold); }
.nav-links a.active { color: var(--gold); border-bottom: 2px solid var(--gold); padding-bottom: 5px; }

.page-header { padding: 140px 20px 60px; text-align: center; background: radial-gradient(ellipse at top, rgba(212, 175, 55, 0.15) 0%, transparent 60%), var(--dark); }
.page-header h1 { font-size: clamp(40px, 6vw, 70px); font-weight: 900; background: var(--gradient-gold); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 3px; margin-bottom: 15px; }
.page-header p { color: var(--gold-light); font-size: 16px; letter-spacing: 3px; text-transform: uppercase; }

.services-section { padding: 20px 20px 100px; background: linear-gradient(180deg, var(--dark) 0%, #0f0f0f 100%); }
.services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
.service-card { background: linear-gradient(135deg, rgba(212, 175, 55, 0.08), rgba(10, 10, 10, 0.9)); border: 1.5px solid rgba(212, 175, 55, 0.3); border-radius: 15px; padding: 25px 20px; text-align: center; transition: all 0.3s; cursor: pointer; }
.service-card:hover { transform: translateY(-6px); border-color: var(--gold); box-shadow: 0 10px 40px rgba(212, 175, 55, 0.3); }
.service-icon { width: 60px; height: 60px; margin: 0 auto 15px; background: var(--gradient-gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; color: var(--dark); }
.service-card h3 { font-size: 14px; font-weight: 600; color: var(--text); letter-spacing: 1px; text-transform: uppercase; }

.footer { background: #050505; padding: 30px 20px; text-align: center; border-top: 1px solid rgba(212, 175, 55, 0.2); }
.footer p { color: var(--text-muted); font-size: 13px; }

@media (max-width: 768px) { .nav-links { display: none; } .navbar { padding: 12px 20px; } }
@media (max-width: 768px) {
  .navbar { padding: 10px 15px; }
  .nav-logo { font-size: 18px; }
  .nav-links { display: none; }
  .page-header { padding: 120px 15px 40px; }
  .page-header h1 { font-size: 40px; }
  .services-grid { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; }
  .service-card { padding: 15px; }
  .service-icon { width: 50px; height: 50px; font-size: 20px; }
  .service-card h3 { font-size: 12px; }
}
.service-card {
  background: #1a1a1a;
  border: 1.5px solid rgba(212,175,55,0.3);
  border-radius: 15px;
  overflow: hidden;
  transition: all 0.3s;
  cursor: pointer;
}
.service-card:hover {
  transform: translateY(-5px);
  border-color: #d4af37;
  box-shadow: 0 10px 30px rgba(212,175,55,0.2);
}
.service-image {
  width: 100%;
  height: 200px;
  object-fit: cover;
}
.service-content {
  padding: 20px;
  text-align: center;
}
.service-content h3 {
  color: #d4af37;
  font-size: 16px;
  margin: 0;
  font-family: 'Cinzel', serif;
  letter-spacing: 1px;
}
</style>
