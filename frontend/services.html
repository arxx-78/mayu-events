<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --gold: #d4af37;
  --gold-light: #ffd700;
  --dark: #0a0a0a;
  --text: #ffffff;
  --text-muted: #a0a0a0;
  --gradient-gold: linear-gradient(135deg, #ffd700 0%, #d4af37 50%, #b8860b 100%);
}
body { font-family: 'Poppins', sans-serif; background: var(--dark); color: var(--text); overflow-x: hidden; }
h1, h2, h3 { font-family: 'Cinzel', serif; }

/* NAVBAR */
.navbar {
  position: fixed; top: 0; left: 0; right: 0;
  background: rgba(10, 10, 10, 0.95);
  backdrop-filter: blur(10px);
  padding: 15px 40px;
  display: flex; justify-content: space-between; align-items: center;
  z-index: 1000;
  border-bottom: 2px solid rgba(212, 175, 55, 0.3);
}
.nav-logo {
  display: flex; align-items: center; gap: 12px;
  font-size: 22px; font-weight: 800;
  background: var(--gradient-gold);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  font-family: 'Cinzel', serif;
  letter-spacing: 1px;
  text-decoration: none;
}
.nav-logo i { color: var(--gold); -webkit-text-fill-color: var(--gold); }
.nav-links { display: flex; gap: 30px; align-items: center; }
.nav-links a {
  color: var(--text); text-decoration: none;
  font-size: 14px; font-weight: 500;
  transition: all 0.3s; letter-spacing: 1px; text-transform: uppercase;
}
.nav-links a:hover { color: var(--gold); }
.nav-links a.active { color: var(--gold); border-bottom: 2px solid var(--gold); padding-bottom: 5px; }

/* HEADER */
.page-header {
  padding: 140px 20px 60px;
  text-align: center;
  background: radial-gradient(ellipse at top, rgba(212, 175, 55, 0.15) 0%, transparent 60%), var(--dark);
}
.page-header h1 {
  font-size: clamp(40px, 6vw, 70px);
  font-weight: 900;
  background: var(--gradient-gold);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: 3px;
  margin-bottom: 15px;
}
.page-header p { color: var(--gold-light); font-size: 16px; letter-spacing: 3px; text-transform: uppercase; }

/* SERVICES GRID */
.services-section { padding: 20px 20px 100px; background: var(--dark); }
.services-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
  max-width: 1200px;
  margin: 0 auto;
}
.service-card {
  background: #1a1a1a;
  border: 1.5px solid rgba(212, 175, 55, 0.3);
  border-radius: 15px;
  overflow: hidden;
  transition: all 0.3s;
  cursor: pointer;
}
.service-card:hover {
  transform: translateY(-5px);
  border-color: var(--gold);
  box-shadow: 0 10px 30px rgba(212, 175, 55, 0.2);
}
.service-image {
  width: 100%;
  height: 180px;
  object-fit: cover;
}
.service-content {
  padding: 20px;
  text-align: center;
}
.service-content h3 {
  color: var(--gold-light);
  font-size: 15px;
  margin: 0;
  letter-spacing: 1px;
  text-transform: uppercase;
}

/* FOOTER */
.footer { background: #050505; padding: 30px 20px; text-align: center; border-top: 1px solid rgba(212, 175, 55, 0.2); }
.footer p { color: var(--text-muted); font-size: 13px; }

@media (max-width: 768px) {
  .nav-links { display: none; }
  .navbar { padding: 12px 20px; }
  .services-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .service-image { height: 120px; }
  .service-content { padding: 12px; }
  .service-content h3 { font-size: 11px; }
}
</style>
</head>
