<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Your Event - MAYU EVENTS</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --gold: #d4af37;
  --gold-light: #ffd700;
  --gold-dark: #b8860b;
  --dark: #0a0a0a;
  --dark-2: #1a1a1a;
  --text: #ffffff;
  --text-muted: #a0a0a0;
  --gradient-gold: linear-gradient(135deg, #ffd700 0%, #d4af37 50%, #b8860b 100%);
}
body { font-family: 'Poppins', sans-serif; background: var(--dark); color: var(--text); overflow-x: hidden; }
h1, h2, h3 { font-family: 'Cinzel', serif; }

/* NAVBAR */
.navbar {
  position: fixed; top: 0; left: 0; right: 0;
  background: rgba(10, 10, 10, 0.95);
  backdrop-filter: blur(10px);
  padding: 15px 40px;
  display: flex; justify-content: space-between; align-items: center;
  z-index: 1000;
  border-bottom: 2px solid rgba(212, 175, 55, 0.3);
}
.nav-logo {
  display: flex; align-items: center; gap: 12px;
  font-size: 22px; font-weight: 800;
  background: var(--gradient-gold);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  font-family: 'Cinzel', serif;
  letter-spacing: 1px;
  text-decoration: none;
}
.nav-logo i { color: var(--gold); -webkit-text-fill-color: var(--gold); }
.nav-links { display: flex; gap: 30px; align-items: center; }
.nav-links a {
  color: var(--text); text-decoration: none;
  font-size: 14px; font-weight: 500;
  transition: all 0.3s; letter-spacing: 1px; text-transform: uppercase;
}
.nav-links a:hover { color: var(--gold); }
.nav-links a.active { color: var(--gold); border-bottom: 2px solid var(--gold); padding-bottom: 5px; }

/* HEADER */
.page-header {
  padding: 140px 20px 60px;
  text-align: center;
  background: radial-gradient(ellipse at top, rgba(212, 175, 55, 0.15) 0%, transparent 60%), var(--dark);
}
.page-header h1 {
  font-size: clamp(40px, 6vw, 70px);
  font-weight: 900;
  background: var(--gradient-gold);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: 3px;
  margin-bottom: 15px;
}
.page-header p { color: var(--gold-light); font-size: 16px; letter-spacing: 3px; text-transform: uppercase; }

/* BOOKING SECTION */
.booking-section { padding: 20px 20px 100px; background: var(--dark); }
.booking-container {
  max-width: 800px; margin: 0 auto;
  background: linear-gradient(135deg, rgba(26, 26, 26, 0.98), rgba(10, 10, 10, 0.98));
  border: 2px solid rgba(212, 175, 55, 0.4);
  border-radius: 20px; padding: 50px 40px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), inset 0 0 40px rgba(212, 175, 55, 0.05);
  position: relative;
}
.booking-container::before {
  content: '👑'; position: absolute; top: -25px; left: 50%;
  transform: translateX(-50%); font-size: 40px;
  background: var(--dark); padding: 0 15px;
}
.booking-container h2 {
  text-align: center; font-size: 32px;
  background: var(--gradient-gold);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 10px; letter-spacing: 2px;
}
.booking-container .sub { text-align: center; color: var(--text-muted); margin-bottom: 35px; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; }

.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.form-group { margin-bottom: 20px; }
.form-group label { display: block; color: var(--gold); font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }
.form-group input, .form-group select, .form-group textarea {
  width: 100%; padding: 14px 18px;
  background: rgba(10, 10, 10, 0.8);
  border: 1.5px solid rgba(212, 175, 55, 0.3);
  border-radius: 10px; color: var(--text);
  font-family: inherit; font-size: 14px; transition: all 0.3s;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  outline: none; border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
  background: rgba(10, 10, 10, 0.95);
}
.form-group input::placeholder, .form-group textarea::placeholder { color: #555; }
.form-group select option { background: var(--dark-2); color: var(--text); }

.booking-submit {
  width: 100%; padding: 16px;
  background: var(--gradient-gold); color: var(--dark);
  border: none; border-radius: 10px;
  font-size: 15px; font-weight: 700;
  letter-spacing: 3px; text-transform: uppercase;
  cursor: pointer; transition: all 0.3s;
  margin-top: 10px;
  box-shadow: 0 4px 20px rgba(212, 175, 55, 0.4);
  font-family: inherit;
}
.booking-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(212, 175, 55, 0.6); }

/* MODAL */
.success-modal {
  position: fixed; inset: 0;
  background: rgba(0, 0, 0, 0.9);
  display: none; align-items: center; justify-content: center;
  z-index: 2000; padding: 20px; backdrop-filter: blur(10px);
}
.success-modal.active { display: flex; }
.success-content {
  background: linear-gradient(135deg, var(--dark-2), var(--dark));
  border: 2px solid var(--gold);
  padding: 50px 40px; border-radius: 20px;
  text-align: center; max-width: 450px; width: 100%;
  box-shadow: 0 20px 60px rgba(212, 175, 55, 0.3);
}
.success-content i { font-size: 70px; color: var(--gold); margin-bottom: 20px; filter: drop-shadow(0 4px 20px rgba(212, 175, 55, 0.6)); }
.success-content h2 { font-size: 28px; background: var(--gradient-gold); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 15px; letter-spacing: 2px; }
.success-content p { color: var(--text-muted); margin-bottom: 25px; }
.success-content button { padding: 12px 30px; background: var(--gradient-gold); color: var(--dark); border: none; border-radius: 50px; font-weight: 700; letter-spacing: 2px; cursor: pointer; font-family: inherit; transition: all 0.3s; }
.success-content button:hover { transform: scale(1.05); }

/* FOOTER */
.footer { background: #050505; padding: 30px 20px; text-align: center; border-top: 1px solid rgba(212, 175, 55, 0.2); }
.footer p { color: var(--text-muted); font-size: 13px; }

/* RESPONSIVE */
@media (max-width: 768px) {
  .nav-links { display: none; }
  .navbar { padding: 12px 20px; }
  .form-row { grid-template-columns: 1fr; }
  .booking-container { padding: 40px 25px; }
}
</style>
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="nav-logo"><i class="fas fa-crown"></i> MAYU EVENTS</a>
  <div class="nav-links">
    <a href="index.html#services">Services</a>
    <a href="booking.html" class="active">Book Now</a>
    <a href="index.html#contact">Contact</a>
    <a href="login.html">Admin</a>
  </div>
</nav>

<section class="page-header">
  <h1>BOOK YOUR EVENT</h1>
  <p>Let's Create Magic Together</p>
</section>

<section class="booking-section">
  <div class="booking-container">
    <h2>Event Booking Form</h2>
    <p class="sub">Fill the details below to start planning</p>
    
    <form class="booking-form" id="mainBookingForm">
      <div class="form-row">
        <div class="form-group">
          <label>Full Name *</label>
          <input type="text" name="name" placeholder="Your name" required>
        </div>
        <div class="form-group">
          <label>Phone Number *</label>
          <input type="tel" name="phone" placeholder="+91 98765 43210" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Email Address *</label>
          <input type="email" name="email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label>Event Type *</label>
          <select name="eventType" required>
            <option value="">Select Event Type</option>
            <option value="Birthday Party">Birthday Party</option>
            <option value="Wedding">Wedding</option>
            <option value="Engagement">Engagement</option>
            <option value="Baby Shower">Baby Shower</option>
            <option value="Corporate Event">Corporate Event</option>
            <option value="Stage Decor">Stage Decor</option>
            <option value="Kovil Function">Kovil Function</option>
            <option value="Home Opening">Home Opening</option>
            <option value="School Event">School Event</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Event Date *</label>
          <input type="date" name="date" required>
        </div>
        <div class="form-group">
          <label>Number of Guests</label>
          <select name="guests">
            <option>Less than 50</option>
            <option>50-100</option>
            <option>100-300</option>
            <option>300-500</option>
            <option>500+</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Budget (₹)</label>
        <input type="text" name="budget" placeholder="e.g., 50,000">
      </div>

      <div class="form-group">
        <label>Additional Message</label>
        <textarea name="message" rows="4" placeholder="Tell us about your dream event, any specific requirements..."></textarea>
      </div>

      <button type="submit" class="booking-submit">
        <i class="fas fa-crown"></i> Submit Booking Request
      </button>
    </form>
  </div>
</section>

<footer class="footer">
  <p>© 2026 MAYU EVENTS & MANAGEMENT · Muthur · All Rights Reserved</p>
</footer>

<!-- SUCCESS MODAL -->
<div class="success-modal" id="successModal">
  <div class="success-content">
    <i class="fas fa-check-circle"></i>
    <h2>Booking Received!</h2>
    <p>We'll contact you within 30 minutes.</p>
    <button onclick="closeModal()">Wonderful!</button>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/analytics.js"></script>
<script>
const form = document.getElementById('mainBookingForm');
const successModal = document.getElementById('successModal');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const submitBtn = form.querySelector('button[type="submit"]');
  const originalText = submitBtn.innerHTML;
  submitBtn.disabled = true;
  submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';

  const data = Object.fromEntries(new FormData(form));

  try {
    const res = await API.createBooking(data);
    console.log('✅ Booking saved:', res);
    Analytics.bookingSubmit(data);
    if (res.data?.id) localStorage.setItem('last_booking_id', res.data.id);
    successModal.classList.add('active');
    form.reset();
  } catch (error) {
    alert('❌ ' + error.message);
  } finally {
    submitBtn.disabled = false;
    submitBtn.innerHTML = originalText;
  }
});

function closeModal() {
  successModal.classList.remove('active');
}

document.querySelectorAll('input[type="date"]').forEach(input => {
  const today = new Date().toISOString().split('T')[0];
  input.setAttribute('min', today);
});
</script>
</body>
</html>
